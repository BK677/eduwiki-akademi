    <meta property="og:title" content="EduWiki Akademi - Sanal Derslik Platformu & Makale Kütüphanesi" />
    <meta property="og:description" content="Tüm sınıf seviyelerine uygun, Gemini modelleri destekli, sınav stratejileri ve eğitim makaleleri içeren sanal derslik ve kütüphane." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite WebSocket disconnect/connection failure errors in preview environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('failed to connect') !== -1)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('failed to connect') !== -1)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
